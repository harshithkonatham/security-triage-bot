# Lint, test and scan on every push, then run the bot on its own benchmark (offline).
# The Claude benchmark costs money, so it only runs when started by hand.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly re-scan for newly published CVEs
  workflow_dispatch:
    inputs:
      claude_benchmark:
        description: "Also score Claude on the benchmark (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Tests (coverage gate 90%)
        run: uv run pytest --cov
      - name: Bandit (the bot's own code)
        run: uv run bandit -q -r src -ll
      - name: pip-audit
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --quiet -o /tmp/requirements.txt
          uv run pip-audit --disable-pip --strict -r /tmp/requirements.txt
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  benchmark:
    name: Benchmark (offline baseline)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Scan the benchmark app with Bandit (fresh SARIF)
        # Bandit exits 1 when it finds issues, which is the point here.
        run: uv run bandit -r benchmark/app -f sarif -o bandit.sarif -q || test -s bandit.sarif
      - name: Triage and score (offline)
        run: uv run triage eval bandit.sarif --offline --out reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-offline
          path: reports/

  claude-benchmark:
    name: Benchmark (Claude)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.claude_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run bandit -r benchmark/app -f sarif -o bandit.sarif -q || test -s bandit.sarif
      - name: Triage and score with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run triage eval bandit.sarif --out reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-claude
          path: reports/
