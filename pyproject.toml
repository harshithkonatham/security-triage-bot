[project]
name = "security-triage-bot"
version = "0.1.0"
description = "Triage SAST, dependency and IaC scanner findings (SARIF) with Claude, behind guardrails"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshith Konatham" }]
dependencies = [
    "anthropic>=0.80",
    "pydantic>=2.8",
]

[project.scripts]
triage = "triage_bot.cli:main"

[dependency-groups]
dev = [
    "bandit[sarif]>=1.8",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The benchmark app is deliberately vulnerable; scanners read it, linters don't.
extend-exclude = ["benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["triage_bot"]

[tool.coverage.report]
fail_under = 90
show_missing = true
